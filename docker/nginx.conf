# nginx for the built React app (single-page app). Copied into the frontend image by docker/Dockerfile.
# Note: add_header in a location replaces the ones from the server level, so the two small security
# headers are repeated in each location.
server {
  # 8080 because the non-root nginx image cannot use port 80. docker-compose.yml publishes it as 5173.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Built files have a hash in their name, so they can be cached for a long time.
  # A missing file here is a real 404 (not the app's index.html).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Everything else is the app: a file if it exists, otherwise index.html, so React Router
  # deep links (/insights, /users, /admin/books) still work after a refresh.
  # index.html is never cached, so a new build is picked up right away.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
